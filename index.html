<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Esta línea pide a Google y a otros buscadores que NO indexen la página.
     Sigue siendo accesible para cualquiera que tenga el enlace, pero no
     aparece al buscar tu nombre. Si algún día querés que sí aparezca,
     borrá la línea de abajo. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="CV · Magdalena Ayerra">
<title>Magdalena Ayerra — CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Public+Sans:ital,wght@0,300..800;1,300..600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#DFE9E2;        /* verde agua muy pálido */
    --card:#EAF1EB;
    --ink:#0E2A22;          /* verde bosque profundo */
    --ink-soft:#4C6459;
    --green:#17604A;        /* verde principal */
    --green-mid:#3A8A70;    /* verde medio, barras */
    --ochre:#8C5A2B;        /* contrapunto cálido, uso mínimo */
    --rule:#B2C4B9;
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --body:'Public Sans',system-ui,sans-serif;
    --maxw:1080px;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding:0 24px 96px;
  }

  .wrap{max-width:var(--maxw);margin:0 auto}

  .eyebrow{
    font-family:var(--body);
    font-size:11px;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ink-soft);
  }
  .eyebrow-g{color:var(--green)}

  h2.section-title{
    font-family:var(--display);
    font-size:clamp(22px,3vw,30px);
    font-weight:600;letter-spacing:-.01em;line-height:1.15;margin-top:6px;
  }

  /* ---------- top bar ---------- */
  .topbar{
    max-width:var(--maxw);margin:0 auto;
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:20px 0 0;flex-wrap:wrap;
  }
  .filecode{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
  .controls{display:flex;gap:8px;align-items:center}
  .btn{
    font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;padding:7px 13px;
    border:1px solid var(--rule);background:transparent;color:var(--ink-soft);
    cursor:pointer;border-radius:2px;
    transition:background .15s,color .15s,border-color .15s;
  }
  .btn:hover{border-color:var(--green);color:var(--green)}
  .btn[aria-pressed="true"]{background:var(--green);color:#F2F7F3;border-color:var(--green)}
  .btn:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}

  /* ---------- hero ---------- */
  header.hero{padding:44px 0 0}
  .hero-top{display:grid;grid-template-columns:1fr;gap:34px;align-items:start}
  .hero-top.has-photo{grid-template-columns:1fr 232px}
  @media (max-width:820px){.hero-top.has-photo{grid-template-columns:1fr}}

  .portrait{
    width:100%;aspect-ratio:4/5;object-fit:cover;
    border:1px solid var(--rule);border-radius:2px;
    filter:saturate(.92);
  }
  .portrait-wrap{max-width:232px}
  .portrait-cap{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:9px}

  .hero h1{
    font-family:var(--display);font-weight:700;
    font-size:clamp(44px,10.5vw,124px);
    line-height:.88;letter-spacing:-.035em;margin:14px 0 0;
  }
  .hero h1 .surname{display:block;color:var(--green)}

  .role-line{
    font-family:var(--display);
    font-size:clamp(15px,2.1vw,21px);font-weight:500;
    margin-top:22px;max-width:44ch;line-height:1.3;
  }
  .thesis{
    margin-top:20px;max-width:62ch;
    font-size:clamp(15px,1.6vw,17.5px);color:var(--ink-soft);line-height:1.62;
  }
  .thesis strong{color:var(--ink);font-weight:600}

  .status-line{
    margin-top:22px;padding:12px 15px;
    background:var(--card);border-left:2.5px solid var(--ochre);border-radius:2px;
    font-size:13.5px;color:var(--ink-soft);max-width:60ch;
  }
  .status-line strong{color:var(--ink);font-weight:650}

  /* ---------- career path (signature) ---------- */
  .path{margin:56px 0 0;padding-bottom:8px}
  .path-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;gap:16px}
  .path-rule{position:relative;height:64px;border-top:1.5px solid var(--ink)}
  .path-rule::before{
    content:"";position:absolute;top:0;left:0;right:0;height:6px;
    background-image:repeating-linear-gradient(to right,var(--rule) 0 1px,transparent 1px 22px);
  }
  .stop{position:absolute;top:0;transform:translateX(-50%);text-align:center;width:130px}
  .stop .dot{width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--green);margin:0 auto}
  .stop .pin{width:1.5px;height:17px;background:var(--green);margin:0 auto}
  .stop .city{font-family:var(--display);font-size:13.5px;font-weight:600;margin-top:7px;line-height:1.2}
  .stop .yrs{font-size:10.5px;color:var(--ink-soft);letter-spacing:.05em;margin-top:2px}
  .stop:first-child{transform:translateX(0);text-align:left}
  .stop:first-child .pin,.stop:first-child .dot{margin:0}
  .stop:last-child{transform:translateX(-100%);text-align:right}
  .stop:last-child .pin,.stop:last-child .dot{margin:0 0 0 auto}

  @media (max-width:720px){
    .path-rule{height:auto;border-top:none}
    .path-rule::before{display:none}
    .stop{position:static;transform:none !important;text-align:left !important;width:auto;
      display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
    .stop .pin{display:none}
    .stop .dot{margin:0 !important;flex:none}
    .stop .city{margin-top:0;flex:1}
    .stop .yrs{margin-top:0}
  }

  /* ---------- ledger ---------- */
  .ledger{
    margin-top:64px;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule);
    display:grid;grid-template-columns:repeat(4,1fr);
  }
  .ledger-item{padding:22px 20px 24px;border-right:1px solid var(--rule)}
  .ledger-item:last-child{border-right:none}
  .ledger-item:first-child{padding-left:0}
  .ledger-num{
    font-family:var(--display);font-size:clamp(28px,4.2vw,44px);
    font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--green);
  }
  .ledger-cap{font-size:12.5px;color:var(--ink-soft);margin-top:9px;line-height:1.4;max-width:22ch}
  @media (max-width:760px){
    .ledger{grid-template-columns:repeat(2,1fr)}
    .ledger-item{border-bottom:1px solid var(--rule);padding-left:0;padding-right:16px}
    .ledger-item:nth-child(2n){border-right:none}
    .ledger-item:nth-last-child(-n+2){border-bottom:none}
  }

  /* ---------- sections ---------- */
  section{margin-top:84px}
  .section-head{border-bottom:1.5px solid var(--ink);padding-bottom:14px;margin-bottom:34px}
  .section-head .note{font-size:13px;color:var(--ink-soft);margin-top:8px;max-width:58ch}

  /* ---------- experience ---------- */
  .parcel{display:grid;grid-template-columns:168px 1fr;gap:32px;padding:28px 0 30px;border-bottom:1px solid var(--rule)}
  .parcel:last-child{border-bottom:none}
  .parcel-meta .dates{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
  .parcel-meta .place{font-size:12.5px;color:var(--ink-soft);margin-top:5px}
  .bar-track{margin-top:14px;height:7px;background:rgba(14,42,34,.10);border-radius:1px;overflow:hidden}
  .bar-fill{height:100%;background:var(--green-mid);border-radius:1px}
  .bar-cap{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-top:7px}

  .parcel-body h3{
    font-family:var(--display);font-size:clamp(19px,2.4vw,25px);
    font-weight:650;letter-spacing:-.015em;line-height:1.2;
  }
  .parcel-body .org{font-size:14px;color:var(--ochre);font-weight:650;margin-top:5px}
  .parcel-body .brief{margin-top:13px;color:var(--ink-soft);font-size:15px;max-width:66ch;line-height:1.6}
  .parcel-body ul{list-style:none;margin-top:16px;display:grid;gap:9px}
  .parcel-body li{position:relative;padding-left:19px;font-size:14.5px;line-height:1.55;max-width:70ch}
  .parcel-body li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:1.5px;background:var(--green-mid)}
  @media (max-width:760px){
    .parcel{grid-template-columns:1fr;gap:14px}
    .bar-track{max-width:260px}
  }

  /* ---------- cards ---------- */
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  @media (max-width:820px){.grid3{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

  .card{
    background:var(--card);border:1px solid var(--rule);
    border-left:2.5px solid var(--green-mid);
    padding:20px 20px 22px;border-radius:2px;
  }
  .card.c-deep{border-left-color:var(--green)}
  .card.c-ochre{border-left-color:var(--ochre)}
  .card h4{font-family:var(--display);font-size:17px;font-weight:650;line-height:1.25;letter-spacing:-.01em}
  .card h4 a{
    color:inherit;text-decoration:none;
    border-bottom:1.5px solid var(--ochre);
    transition:color .15s,border-color .15s;
  }
  .card h4 a:hover{color:var(--ochre)}
  .card h4 a:focus-visible{outline:2px solid var(--ochre);outline-offset:3px}
  .card .sub{font-size:13px;color:var(--ink-soft);margin-top:6px}
  .card .desc{font-size:13.5px;color:var(--ink-soft);margin-top:11px;line-height:1.55}
  .tag{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;padding:3px 8px;border-radius:2px;margin-top:12px;
    background:rgba(140,90,43,.13);color:var(--ochre);
  }
  .tag.t-done{background:rgba(23,96,74,.13);color:var(--green)}
  .tag.t-plan{background:rgba(76,100,89,.14);color:var(--ink-soft)}

  /* ---------- rows ---------- */
  .rows{border-top:1px solid var(--rule)}
  .row{display:grid;grid-template-columns:110px 1fr auto;gap:20px;align-items:baseline;
    padding:15px 0;border-bottom:1px solid var(--rule)}
  .row .yr{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft)}
  .row .what{font-size:15px;font-weight:500}
  .row .what span{display:block;font-size:13px;color:var(--ink-soft);font-weight:400;margin-top:3px}
  .row .where{font-size:12.5px;color:var(--ink-soft);text-align:right}
  @media (max-width:640px){
    .row{grid-template-columns:1fr;gap:5px}
    .row .where{text-align:left}
  }

  /* ---------- languages ---------- */
  .langs{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  @media (max-width:640px){.langs{grid-template-columns:repeat(2,1fr)}}
  .lang .name{font-family:var(--display);font-size:17px;font-weight:650}
  .lang .lvl{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
  .lang .meter{display:flex;gap:3px;margin-top:9px}
  .lang .meter i{height:5px;flex:1;background:rgba(14,42,34,.14);border-radius:1px}
  .lang .meter i.on{background:var(--green-mid)}

  /* ---------- footer ---------- */
  footer{
    margin-top:88px;padding-top:30px;border-top:1.5px solid var(--ink);
    display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end;
  }
  footer .contact a{
    display:block;font-family:var(--display);font-size:clamp(17px,2.4vw,23px);
    font-weight:600;color:var(--ink);text-decoration:none;letter-spacing:-.01em;
    border-bottom:1.5px solid transparent;transition:border-color .15s,color .15s;
    width:fit-content;margin-top:6px;
  }
  footer .contact a:hover{border-bottom-color:var(--green);color:var(--green)}
  footer .contact a:focus-visible{outline:2px solid var(--ochre);outline-offset:3px}
  footer .stamp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);text-align:right;line-height:1.9}
  @media (max-width:640px){footer .stamp{text-align:left}}

  .signature{
    margin-top:26px;text-align:center;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);opacity:.6;
  }

  /* ---------- print ---------- */
  @media print{
    body{background:#fff;color:#000;padding:0;font-size:10.5pt}
    .controls,.path{display:none}
    .signature{display:none}
    .topbar{padding:0}
    header.hero{padding:0}
    .hero h1{font-size:34pt}
    .hero h1 .surname{color:#000}
    .portrait-wrap{max-width:150px}
    section{margin-top:20pt;break-inside:avoid}
    .parcel{break-inside:avoid;padding:12pt 0}
    .card{background:#fff;break-inside:avoid}
    .ledger{margin-top:16pt}
    footer{margin-top:20pt}
    a{color:#000}
  }
</style>
</head>

const $ = id => document.getElementById(id);

function render(code){
  const d = DATA[code];
  document.documentElement.lang = d.lang;

  $('filecode').textContent = d.filecode;
  $('btn-print').textContent = d.printBtn;

  $('hero-eyebrow').textContent = d.hero.eyebrow;
  $('hero-role').textContent = d.hero.role;
  $('hero-thesis').innerHTML = d.hero.thesis;
  $('hero-status').innerHTML = d.hero.status;

  const showPhoto = PHOTO && (code !== 'en' || PHOTO_IN_ENGLISH);
  $('hero-top').classList.toggle('has-photo', !!showPhoto);
  $('photo-slot').innerHTML = showPhoto
    ? `<div class="portrait-wrap"><img class="portrait" src="${PHOTO}" alt="Magdalena Ayerra"></div>`
    : '';

  $('path-title').textContent = d.path.title;
  $('path-sub').textContent = d.path.sub;
  $('path-rule').innerHTML = d.stops.map((s,i)=>{
    const pct = (i/(d.stops.length-1))*100;
    return `<div class="stop" style="left:${pct}%">
      <div class="dot"></div><div class="pin"></div>
      <div class="city">${s.city}</div><div class="yrs">${s.yrs}</div>
    </div>`;
  }).join('');

  $('ledger').innerHTML = d.ledger.map(l=>
    `<div class="ledger-item"><div class="ledger-num">${l.n}</div><div class="ledger-cap">${l.c}</div></div>`
  ).join('');

  $('exp-eyebrow').textContent = d.exp.eyebrow;
  $('exp-title').textContent = d.exp.title;
  $('exp-note').textContent = d.exp.note;
  $('exp-list').innerHTML = d.exp.items.map(it=>`
    <article class="parcel">
      <div class="parcel-meta">
        <div class="dates">${it.dates}</div>
        <div class="place">${it.place}</div>
        ${it.bar>0?`<div class="bar-track"><div class="bar-fill" style="width:${it.bar}%"></div></div>
        <div class="bar-cap">${it.barcap}</div>`:''}
      </div>
      <div class="parcel-body">
        <h3>${it.title}</h3>
        <div class="org">${it.org}</div>
        <p class="brief">${it.brief}</p>
        ${it.bullets.length?`<ul>${it.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`:''}
      </div>
    </article>`).join('');

  $('edu-eyebrow').textContent = d.edu.eyebrow;
  $('edu-title').textContent = d.edu.title;
  $('edu-list').innerHTML = d.edu.items.map(e=>
    `<div class="card"><h4>${e.t}</h4><div class="sub">${e.s}</div>${e.d?`<p class="desc">${e.d}</p>`:''}</div>`
  ).join('');

  $('fel-eyebrow').textContent = d.fel.eyebrow;
  $('fel-title').textContent = d.fel.title;
  $('fel-note').textContent = d.fel.note;
  $('fel-list').innerHTML = d.fel.items.map(f=>
    `<div class="card c-deep"><h4>${f.t}</h4><div class="sub">${f.s}</div><p class="desc">${f.d}</p></div>`
  ).join('');

  $('dig-eyebrow').textContent = d.dig.eyebrow;
  $('dig-title').textContent = d.dig.title;
  $('dig-note').textContent = d.dig.note;
  $('dig-list').innerHTML = d.dig.items.map(x=>{
    const head = x.url
      ? `<a href="${x.url}" target="_blank" rel="noopener">${x.t}</a>`
      : x.t;
    return `<div class="card c-ochre"><h4>${head}</h4><div class="sub">${x.s}</div><p class="desc">${x.d}</p><span class="tag ${x.tagclass}">${x.tag}</span></div>`;
  }).join('');

  $('con-eyebrow').textContent = d.con.eyebrow;
  $('con-title').textContent = d.con.title;
  $('con-note').textContent = d.con.note;
  $('con-list').innerHTML = d.con.items.map(c=>
    `<div class="card"><h4>${c.t}</h4><div class="sub">${c.s}</div><p class="desc">${c.d}</p></div>`
  ).join('');

  $('int-eyebrow').textContent = d.int.eyebrow;
  $('int-title').textContent = d.int.title;
  $('int-list').innerHTML = d.int.items.map(i=>
    `<div class="row"><div class="yr">${i.yr}</div><div class="what">${i.w}<span>${i.s}</span></div><div class="where">${i.p}</div></div>`
  ).join('');

  $('lang-eyebrow').textContent = d.langs.eyebrow;
  $('lang-title').textContent = d.langs.title;
  $('lang-list').innerHTML = d.langs.items.map(l=>{
    const bars = [1,2,3,4].map(n=>`<i class="${n<=l.v?'on':''}"></i>`).join('');
    return `<div class="lang"><div class="name">${l.n}</div><div class="lvl">${l.l}</div><div class="meter">${bars}</div></div>`;
  }).join('');

  $('foot-eyebrow').textContent = d.foot.eyebrow;
  $('foot-stamp').innerHTML = d.foot.stamp;

  ['es','ca','en'].forEach(c => $('btn-'+c).setAttribute('aria-pressed', c===code));
}

$('btn-es').addEventListener('click',()=>render('es'));
$('btn-ca').addEventListener('click',()=>render('ca'));
$('btn-en').addEventListener('click',()=>render('en'));
$('btn-print').addEventListener('click',()=>window.print());

render('es');
</script>
</body>
</html>
