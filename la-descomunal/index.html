<style>

  .hero h1 span{display:block;color:var(--green)}

  .intro strong{color:var(--ink);font-weight:600}

  .ledger-cap{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.4}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .prose p{color:var(--ink-soft);max-width:62ch}
  .prose p+p{margin-top:14px}
  .prose strong{color:var(--ink);font-weight:600}
  .pull{font-family:var(--display);font-size:clamp(18px,2vw,22px);font-weight:500;line-height:1.35;border-left:2.5px solid var(--ochre);padding-left:18px}

  .tool-head a{font-size:13px;font-weight:700;color:var(--green);text-decoration:none;border-bottom:1.5px solid var(--green)}
  .shots{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  .shots.with-phone{grid-template-columns:2fr 1fr}
  figure{background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:10px}
  figure a{display:block}
  figure img{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:1px}
  figcaption{font-size:12.5px;color:var(--ink-soft);margin-top:9px;line-height:1.45}

  .compare-row{margin-top:16px}

  .compare-phone .compare-pair{max-width:680px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--rule);border-left:2.5px solid var(--green-mid);padding:20px 20px 22px;border-radius:2px}
  .card.c-ochre{border-left-color:var(--ochre)}
  .card h4{font-family:var(--display);font-size:17px;font-weight:650;line-height:1.25}
  .card p{font-size:14px;color:var(--ink-soft);margin-top:9px}
  .stack{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .stack span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;background:rgba(23,96,74,.12);color:var(--green);border-radius:2px}
  .steps{border-top:1px solid var(--rule);margin-top:26px}
  .step{display:grid;grid-template-columns:130px 1fr;gap:20px;padding:15px 0;border-bottom:1px solid var(--rule)}
  .step .when{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
  .step .what{font-size:15px}
  .step .what span{display:block;font-size:13.5px;color:var(--ink-soft);margin-top:3px}

  footer{margin-top:88px;padding-top:30px;border-top:1.5px solid var(--ink);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end}
  footer .contact a{display:block;font-family:var(--display);font-size:clamp(17px,2.4vw,23px);font-weight:600;text-decoration:none;margin-top:6px;width:fit-content;border-bottom:1.5px solid transparent}
  footer .contact a:hover{color:var(--green);border-bottom-color:var(--green)}
  footer .note{font-size:12px;color:var(--ink-soft);max-width:42ch}

  @media (max-width:820px){
    .cols,.grid2,.shots,.shots.with-phone{grid-template-columns:1fr}
    .compare-pair{gap:10px}
    .compare-row:not(.compare-phone) .compare-pair{grid-template-columns:1fr}
    .ledger{grid-template-columns:1fr 1fr}
    .ledger-item:nth-child(3){padding-left:0;border-left:0}
    .ledger-item:nth-child(n+3){border-top:1px solid var(--rule)}
    .step{grid-template-columns:1fr;gap:4px}
  }
  @media print{
    body{background:#fff;padding:0}
    .controls,.back{display:none}
    section,figure,.card{break-inside:avoid}
  }
</style>
</head>

const $ = id => document.getElementById(id);
const paras = list => list.map(p => `<p>${p}</p>`).join('');
const shot = s => `<figure class="${s.phone?'phone':''}"><a href="${SHOTS[s.k]}" target="_blank" rel="noopener"><img src="${SHOTS[s.k]}" alt="${s.c}" loading="lazy"></a><figcaption>${s.c}</figcaption></figure>`;

function render(code){
  const d = DATA[code];
  document.documentElement.lang = code;
  document.title = d.title;
  $('back').textContent = d.back;
  $('back').href = `../?lang=${code}`;
  $('eyebrow').textContent = d.eyebrow;
  $('h1-sub').textContent = d.h1sub;
  $('lede').textContent = d.lede;
  $('intro').innerHTML = d.intro;
  $('ledger').innerHTML = d.ledger.map(l => `<div class="ledger-item"><div class="ledger-num">${l.n}</div><div class="ledger-cap">${l.c}</div></div>`).join('');

  $('ctx-eyebrow').textContent = d.ctx.eyebrow; $('ctx-title').textContent = d.ctx.title;
  $('ctx-text').innerHTML = paras(d.ctx.text); $('ctx-pull').textContent = d.ctx.pull;

  $('dash-eyebrow').textContent = d.dash.eyebrow; $('dash-title').textContent = d.dash.title;
  $('dash-text').innerHTML = paras(d.dash.text);
  $('dash-shots').innerHTML = d.dash.shots.map(shot).join('');
  $('dash-decisions').innerHTML = d.dash.decisions.map(x => `<div class="card"><h4>${x.t}</h4><p>${x.d}</p></div>`).join('');

  $('web-eyebrow').textContent = d.web.eyebrow; $('web-title').textContent = d.web.title;
  $('web-text').innerHTML = paras(d.web.text);
  const cmp = d.web.compare;
  const side = (key, label, phone) => SHOTS[key]
    ? `<figure class="${phone ? 'phone' : ''}"><span class="badge${key.startsWith('antes') ? '' : ' badge-new'}">${label}</span><a href="${SHOTS[key]}" target="_blank" rel="noopener"><img src="${SHOTS[key]}" alt="${label}" loading="lazy"></a></figure>` : '';
  const rows = [[cmp.desktop, 'antesWeb', 'webPortada', false], [cmp.mobile, 'antesMovil', 'webMobil', true]];
  $('compare-title').textContent = cmp.title;
  $('compare').innerHTML = rows.map(([label, before, after, phone]) => `
    <div class="compare-row${phone ? ' compare-phone' : ''}">
      <div class="compare-label">${label}</div>
      <div class="compare-pair${SHOTS[before] ? '' : ' single'}">${side(before, cmp.before, phone)}${side(after, cmp.after, phone)}</div>
    </div>`).join('');
  $('web-link').textContent = d.web.link;

  $('how-eyebrow').textContent = d.how.eyebrow; $('how-title').textContent = d.how.title;
  $('how-text').innerHTML = paras(d.how.text);
  $('stack-title').textContent = d.how.stackTitle;
  $('stack').innerHTML = d.how.stack.map(s => `<span>${s}</span>`).join('');
  $('steps').innerHTML = d.how.steps.map(s => `<div class="step"><div class="when">${s.w}</div><div class="what">${s.t}<span>${s.s}</span></div></div>`).join('');

  $('next-eyebrow').textContent = d.next.eyebrow; $('next-title').textContent = d.next.title;
  $('next-list').innerHTML = d.next.items.map(x => `<div class="card c-ochre"><h4>${x.t}</h4><p>${x.d}</p></div>`).join('');

  $('foot-eyebrow').textContent = d.foot.eyebrow; $('foot-note').textContent = d.foot.note;
  ['es','en','ca'].forEach(c => $('btn-'+c).setAttribute('aria-pressed', c === code));
  try { history.replaceState(null, '', `?lang=${code}`); } catch (e) {}
}

['es','en','ca'].forEach(c => $('btn-'+c).addEventListener('click', () => render(c)));
const requested = new URLSearchParams(location.search).get('lang');
render(DATA[requested] ? requested : 'es');
</script>
</body>
</html>
